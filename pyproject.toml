[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "webscraper"
version = "1.0.0"
description = "A professional web scraper built with Python"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "beautifulsoup4",
    "requests",
    "python-dotenv"
]


[project.optional-dependencies]
dev = [
    "pytest"
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]